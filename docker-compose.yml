services:
  jekyll:
    image: jekyll/jekyll:4
    command: jekyll serve --watch
    environment:
      - JEKYLL_ENV=development
      - VIRTUAL_HOST=${COMPOSE_DOMAIN}
    ports:
      - '4000'
      - '35729'
    volumes:
      - ${PWD}:/srv/jekyll
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_DOMAIN}`)"

  rumdl:
    image: ghcr.io/rvben/rumdl:0.2.79-alpine@sha256:5b4298edcbb50a10c52ab35aee68293b0217e7e01315bc5aab1a65d6697afe80
    working_dir: /md
    volumes:
      - ./:/md

  opengrep:
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 # https://hub.docker.com/layers/library/alpine/3.24.2/
    working_dir: /workspace
    volumes:
      - ./:/workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DIR=".opengrep_cache"
        NAME="opengrep_musllinux_x86"
        BIN="$$DIR/$$NAME"
        URL="https://github.com/opengrep/opengrep/releases/download/v1.30.2"

        if [ ! -f "$$BIN" ]; then
          (
            set -e
            apk add -q --no-cache curl bash cosign > /dev/null 2>&1
            mkdir -p "$$DIR"
            curl -sSL --output-dir "$$DIR" \
              -O "$$URL/$$NAME" \
              -O "$$URL/$$NAME.cert" \
              -O "$$URL/$$NAME.sig"
            cosign verify-blob "$$BIN" \
              --certificate "$$BIN.cert" \
              --signature "$$BIN.sig" \
              --certificate-identity-regexp "^https://github.com/opengrep/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > /dev/null 2>&1
            chmod +x "$$BIN"
          ) || exit 1
        fi

        "$$BIN" scan
