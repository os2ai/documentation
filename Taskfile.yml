version: '3'

# https://taskfile.dev/usage/#env-files
dotenv: [ '.env.local', '.env' ]

vars:
  # https://taskfile.dev/reference/templating/
  OPEN: '{{ if eq OS "darwin" }}open{{ else }}xdg-open{{ end }}'
  DOCKER_COMPOSE: '{{ .TASK_DOCKER_COMPOSE | default "docker compose" }}'

tasks:
  default:
    desc: 'List all tasks'
    cmds:
      - task --list-all
    silent: true

  compose:
    desc: "Run `docker compose` command. Example: task compose -- up --detach"
    cmds:
      - '{{ .DOCKER_COMPOSE }} {{ .CLI_ARGS }}'

  lint:
    desc: "Run markdown linter"
    cmds:
      - task compose -- run --rm rumdl
    silent: true

  format:
    desc: "Run markdown formatter"
    cmds:
      - task compose -- run --rm rumdl rumdl format --no-cache .
    silent: true

  sast:
    desc: "Run SAST using Opengrep"
    cmds:
      - task compose -- run --rm opengrep
    silent: true

  url:
    desc: Print the local URL of the running site
    vars:
      PORT:
        sh: '{{ .DOCKER_COMPOSE }} port jekyll 4000 2>/dev/null | head -n1 | awk -F: "{print \$NF}"'
    preconditions:
      - sh: test -n "{{ .PORT }}"
        msg: "Site is not running. Start it with: task start"
    cmds:
      - echo "http://localhost:{{ .PORT }}"

  open:
    desc: Open the site in the browser
    cmds:
      - '{{ .OPEN }} "$(task url)"'

  start:
    desc: Start the site and print its URL
    cmds:
      - '{{ .DOCKER_COMPOSE }} up --detach jekyll'
      - task: url
