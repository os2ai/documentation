version: '3'

# https://taskfile.dev/usage/#env-files
dotenv: [ '.env.local', '.env' ]

vars:
  # https://taskfile.dev/reference/templating/
  BASE_URL: '{{.TASK_BASE_URL | default .COMPOSE_SERVER_DOMAIN | default .COMPOSE_DOMAIN }}'
  DOCKER_COMPOSE: '{{ .TASK_DOCKER_COMPOSE | default "docker compose" }}'

tasks:
  default:
    desc: 'List all tasks'
    cmds:
      - task --list-all
    silent: true

  compose:
    desc: "Run `docker compose` command. Example: task compose -- up --detach"
    cmds:
      - '{{ .DOCKER_COMPOSE }} {{ .CLI_ARGS }}'

  lint:
    desc: "Run markdown linter"
    cmds:
      - task compose -- run --rm rumdl rumdl check .
    silent: true

  format:
    desc: "Run markdown formatter"
    cmds:
      - task compose -- run --rm rumdl rumdl format .
    silent: true

  sast:
    desc: "Run SAST using Opengrep"
    cmds:
      - task compose -- run --rm opengrep
    silent: true

  clean:
    desc: "Clean up generated files"
    cmds:
      - rm -rf .opengrep_cache _site .rumdl_cache
    silent: true

  open:
    desc: Open the site in the browser
    cmds:
      - open http://{{ .BASE_URL }}
