name: Markdown

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create docker network
        run: |
          docker network create frontend

      - run: |
          docker compose run --rm rumdl rumdl check .
