name: SAT (Static Application Testing)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
      - run: docker compose run --rm opengrep
  markdown:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
      - run: docker compose run --rm rumdl

